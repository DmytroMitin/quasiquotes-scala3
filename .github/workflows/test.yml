name: Test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: Scala ${{ matrix.scala }} (${{ matrix.role }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - scala: "3.8.4"
            experimental: false
            role: required-stable
          - scala: "3.9.0-RC1"
            experimental: true
            role: forward-probe
          - scala: "3.3.8"
            experimental: true
            role: lts-feasibility

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: sbt

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Report compatibility lane
        run: echo "Scala ${{ matrix.scala }} / ${{ matrix.role }} / experimental=${{ matrix.experimental }}"

      - name: Run clean tests with Scala ${{ matrix.scala }}
        run: sbt -batch "++${{ matrix.scala }}!" clean test publicCoreExamples/test core/verifyCoreBoundary verifyModuleGraph
