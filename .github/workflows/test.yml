name: Test

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Scala ${{ matrix.scala }} (${{ matrix.role }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - scala: "3.8.4"
            experimental: false
            role: required-previous-stable
          - scala: "3.9.0"
            experimental: false
            role: required-current-lts
          - scala: "3.3.8"
            experimental: false
            role: required-previous-lts

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "25"
          cache: sbt

      - name: Set up sbt
        uses: sbt/setup-sbt@8feba82adc7f01ddcf8165b86f778bdb5b82cebc # v1

      - name: Report compatibility lane
        run: echo "Scala ${{ matrix.scala }} / ${{ matrix.role }} / experimental=${{ matrix.experimental }}"

      - name: Run clean tests with Scala ${{ matrix.scala }}
        run: sbt -batch "++${{ matrix.scala }}!" clean test publicCoreExamples/test publicApiExamples/test core/verifyCoreBoundary neutralScalameta/verifyNeutralScalametaBoundary verifyModuleGraph verifyScalametaArtifactTopology packageDoc

      - name: Verify release topology policy
        run: |
          python3 tools/release/test-check-release-repository.py
          python3 tools/release/test-release-configuration.py
